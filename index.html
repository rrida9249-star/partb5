<!DOCTYPE html>
<html>
    <head>
        <title>notes manager</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <h1>my notes manager</h1>
            <p>create and manage your note</p>
        </header>
        <div class="content">
            <h2>add a note</h2>
            <input id="note" placeholder="enter your note">
            <button onclick="addNote()">add note</button>
            <h2>my notes</h2>
            <div id="notes"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
